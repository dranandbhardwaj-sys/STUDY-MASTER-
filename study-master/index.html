<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="description" content="Study Master — AI-powered study platform for students, competitive exam aspirants, teachers, and self-learners." />
  <title>Study Master — AI Study &amp; Exam Prep Platform</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Primary Navigation">
      <div class="sidebar-header">
        <a href="#dashboard" class="brand" data-nav="dashboard">
          <img src="./assets/logo.svg" alt="Study Master Logo" class="brand-logo" />
          <div class="brand-text">
            <span class="brand-name">Study Master</span>
            <span class="brand-tag">AI EdTech Studio</span>
          </div>
        </a>
        <button class="icon-btn mobile-only" id="closeSidebarBtn" aria-label="Close navigation menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="sidebar-streak-card" id="sidebarStreakCard">
        <div class="streak-flame">🔥</div>
        <div>
          <div class="streak-count"><span id="sidebarStreakValue">5</span>-Day Streak</div>
          <div class="streak-sub" id="sidebarGoalSummary">0 / 4h today</div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <div class="nav-group-label">Overview</div>
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="ai-tools">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 4.8L19 9.7l-5.1 1.9L12 16.5l-1.9-4.9L5 9.7l5.1-1.9L12 3z"/><path d="M5 18l.9 2.1L8 21l-2.1.9L5 24l-.9-2.1L2 21l2.1-.9L5 18z"/></svg>
          <span>AI Study Tools</span>
          <span class="nav-badge" id="navAiModeBadge">Demo</span>
        </button>
        <button class="nav-item" data-view="mcq">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>MCQ &amp; Mock Tests</span>
        </button>

        <div class="nav-group-label">Library &amp; Exams</div>
        <button class="nav-item" data-view="exams">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <span>Exam Categories</span>
        </button>
        <button class="nav-item" data-view="subjects">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
          <span>Subject Library</span>
        </button>

        <div class="nav-group-label">Productivity &amp; Memory</div>
        <button class="nav-item" data-view="planner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
          <span>Study Planner &amp; Timer</span>
        </button>
        <button class="nav-item" data-view="memory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span>Notes, Flashcards &amp; Bookmarks</span>
        </button>

        <div class="nav-group-label">Account &amp; AI</div>
        <button class="nav-item" data-view="premium">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <span>Premium (₹399/mo)</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>AI Settings &amp; Profile</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="promo-mini" id="sidebarPromoBox">
          <div class="promo-mini-title">Study Master Premium</div>
          <p class="promo-mini-text">Unlock workspace limits &amp; advanced prep tools at ₹399/month.</p>
          <button class="btn btn-sm btn-primary full-width" data-view-jump="premium">View Plan</button>
        </div>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main Workspace -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu-btn" id="openSidebarBtn" aria-label="Open navigation menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="search-wrap" role="search">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="globalSearchInput" placeholder="Search tools, exams, subjects, notes, flashcards..." autocomplete="off" aria-label="Global search" />
            <kbd class="search-kbd">/</kbd>
            <div class="search-results-dropdown hidden" id="globalSearchResults"></div>
          </div>
        </div>

        <div class="topbar-actions">
          <button class="pill-status" id="headerAiStatusBtn" title="Configure AI Provider" data-view-jump="settings">
            <span class="status-dot" id="headerAiDot"></span>
            <span id="headerAiText">Demo Mode</span>
          </button>

          <button class="btn btn-sm btn-outline hidden" id="installPwaBtn" aria-label="Install Study Master App">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Install</span>
          </button>

          <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle dark or light theme" title="Toggle Dark/Light Mode">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>

          <button class="avatar-btn" id="headerProfileBtn" data-view-jump="settings" title="Profile & Settings">
            <span class="avatar-circle" id="headerAvatarInitials">SM</span>
            <span class="avatar-name desktop-only" id="headerUserName">Learner</span>
          </button>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main class="main-content" id="mainContent" tabindex="-1">
        <!-- Views are rendered dynamically by script.js -->
      </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
      <button class="bottom-nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Home</span>
      </button>
      <button class="bottom-nav-item" data-view="ai-tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 4.8L19 9.7l-5.1 1.9L12 16.5l-1.9-4.9L5 9.7l5.1-1.9L12 3z"/></svg>
        <span>AI Tools</span>
      </button>
      <button class="bottom-nav-item" data-view="mcq">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>MCQ</span>
      </button>
      <button class="bottom-nav-item" data-view="planner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Planner</span>
      </button>
      <button class="bottom-nav-item" data-view="memory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>Memory</span>
      </button>
    </nav>
  </div>

  <!-- Reusable Modal Shell -->
  <div class="modal-overlay hidden" id="appModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Dialog</h3>
        <button class="icon-btn" id="closeModalBtn" aria-label="Close modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Stack -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script defer src="./script.js"></script>
</body>
</html>
